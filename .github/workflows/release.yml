name: Release

on:
  push:
    tags: ['v*']
    # A commit on a work branch whose message carries [preview] publishes a preview
    # release; the tag is created on GitHub by this workflow, not pushed by hand.
    branches: ['claude/**']

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[preview]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Remove signing material
        if: always()
        run: rm -f release.keystore keystore.properties

      # Without a keystore the build falls back to app-release-unsigned.apk, so
      # the signed name existing is what proves the secrets were picked up.
      - name: Verify the APK is signed
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            tag="v${version_name}-preview.${GITHUB_RUN_NUMBER}"
          fi
          asset="nike-launcher-${tag}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"

          version_code=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"

          # A tag with a suffix (v0.1.0-preview.1) is a preview: published as a pre-release,
          # so it never shows up as the latest stable version.
          pre=""
          case "$tag" in *-*) pre="--prerelease" ;; esac

          # Idempotent on purpose. GitHub has delivered the same tag push twice, and the
          # second run then failed on "a release with the same tag name already exists" —
          # a red cross against a release that had in fact gone out perfectly well.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" $pre \
              --notes-file "$notes" "$asset"
          else
            gh release create "$tag" --title "$tag" --target "$GITHUB_SHA" $pre \
              --generate-notes "$asset"
          fi
